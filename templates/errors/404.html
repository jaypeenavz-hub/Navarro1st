{% extends "layout.html" %}
{% from "partials/icons.html" import icon %}
{% block title %}Page not found · ByteBodega{% endblock %}

{% block content %}
<div class="empty-state">
  <span class="empty-icon">{{ icon('search', 26) }}</span>
  <h2>Page not found</h2>
  <p>The page you were looking for has moved or never existed.</p>
  <div class="empty-actions">
    <a class="btn btn--primary" href="{{ url_for('shop.home') }}">Back to home</a>
    <a class="btn btn--ghost" href="{{ url_for('shop.products') }}">Browse products</a>
  </div>
</div>
{% endblock %}
